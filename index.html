<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Image Resizer</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Browser Image Resizer</h1>
    <p>Resize JPG, PNG, and WebP images locally in your browser. Nothing is uploaded.</p>
    <form id="resizer-form">
      <label>Image <input id="file" type="file" accept="image/jpeg,image/png,image/webp" required></label>
      <div class="grid">
        <label>Maximum width <input id="width" type="number" min="1" max="20000" placeholder="Optional"></label>
        <label>Maximum height <input id="height" type="number" min="1" max="20000" placeholder="Optional"></label>
      </div>
      <label>Output format
        <select id="format"><option value="image/webp">WebP</option><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select>
      </label>
      <label>Quality <output id="quality-value">85</output><input id="quality" type="range" min="1" max="100" value="85"></label>
      <button type="submit">Resize image</button>
    </form>
    <p id="status" role="status"></p>
    <section id="result" hidden>
      <h2>Result</h2>
      <canvas id="preview"></canvas>
      <a id="download" download>Download image</a>
    </section>
  </main>
</body>
</html>
